<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Press Start 2P', 'Courier New', monospace;
        }

        h1 {
            color: #FFE566;
            font-size: 20px;
            letter-spacing: 6px;
            margin-bottom: 16px;
            text-shadow: 0 0 16px #FFD700, 0 0 32px #FFD70088;
            animation: flicker 3s infinite;
        }

        @keyframes flicker {
            0%, 95%, 100% { opacity: 1; }
            96% { opacity: 0.6; }
            97% { opacity: 1; }
            98% { opacity: 0.4; }
            99% { opacity: 1; }
        }

        canvas {
            background-color: #000;
            border: 2px solid #1a6bff44;
            box-shadow: 0 0 30px #1a3aff66, 0 0 60px #1a3aff22;
            display: block;
        }

        .controls {
            color: #555;
            font-size: 9px;
            margin-top: 14px;
            text-align: center;
            letter-spacing: 1px;
            line-height: 2;
        }

        .controls span {
            color: #888;
        }
    </style>
</head>
<body>
    <h1>PAC-MAN</h1>
    <canvas id="board"></canvas>
    <p class="controls">
        <span>WASD</span> or <span>ARROW KEYS</span> to move &nbsp;|&nbsp; <span>ENTER</span> to restart
    </p>
    <script src="script.js"></script>
</body>
</html>
